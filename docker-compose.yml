version: '3.8'

services:
  chatbot-web:
    build: .
    container_name: chatbotvoice-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Flask-SQLAlchemy puts sqlite:///users.db in the app's instance folder (/app/instance/users.db), not in /app:
      # without this mount the accounts lived in the container and a rebuild would have deleted them.
      - ./instance:/app/instance
      - ./data:/app/data
    environment:
      - SQLALCHEMY_DATABASE_URI=sqlite:///users.db
